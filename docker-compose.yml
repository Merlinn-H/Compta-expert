version: "3.9"

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: compta
      POSTGRES_PASSWORD: compta_secret
      POSTGRES_DB: compta_expert
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Expose only when needed for direct DB access; remove in prod
    # ports:
    #   - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U compta -d compta_expert"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://compta:compta_secret@db:5432/compta_expert
      # IMPORTANT: override SECRET_KEY with a strong random value in production
      SECRET_KEY: ${SECRET_KEY:-change-me-set-SECRET_KEY-env-var}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 1440
      FRANKFURTER_API_URL: https://api.frankfurter.app
      # Restrict CORS to the frontend origin only
      ALLOWED_ORIGINS: http://localhost,http://localhost:80
    expose:
      - "8000"          # internal only — nginx proxies to it
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    # Override CMD for dev with hot-reload; comment out for production
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile   # multi-stage: builds React → serves via nginx
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
